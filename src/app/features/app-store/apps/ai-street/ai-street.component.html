<div class="ai-street-container">
    <!-- Header -->
    <div class="ai-street-header">
        <div class="header-content">
            <i class="pi pi-sparkles header-icon"></i>
            <div class="header-text">
                <h1>AI Street</h1>
                <span class="subtitle">AI-powered data management and analytics hub</span>
            </div>
        </div>
    </div>

    <!-- Tab Navigation -->
    <p-tabs [value]="activeTab()" (valueChange)="onTabChange($any($event))">
        <p-tablist>
            @for (tab of tabs; track tab.label; let i = $index) {
            <p-tab [value]="i">
                <i [class]="tab.icon"></i>
                <span>{{ tab.label }}</span>
            </p-tab>
            }
        </p-tablist>

        <p-tabpanels>
            <!-- Data Management -->
            <p-tabpanel [value]="0">
                <app-input-manager></app-input-manager>
            </p-tabpanel>

            <!-- Model Arena -->
            <p-tabpanel [value]="1">
                <app-model-arena></app-model-arena>
            </p-tabpanel>

            <!-- Test Evaluation Center -->
            <p-tabpanel [value]="2">
                <app-process-manager></app-process-manager>
            </p-tabpanel>

            <!-- Dashboard -->
            <p-tabpanel [value]="3">
                <app-dashboard></app-dashboard>
            </p-tabpanel>
        </p-tabpanels>
    </p-tabs>
</div>
